<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="450" height="100%">
  <defs>
    <!-- Premium Teal to Electric Cyan Gradient -->
    <linearGradient id="snapBuyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Subtle Drop Shadow for Geometric Icon Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Icon Mark Group -->
  <g id="LogoMark" transform="translate(10, 10)" filter="url(#softShadow)">
    <!-- Main S-Bolt Lightning Base -->
    <path d="M45,5 L15,48 L38,48 L20,80 L62,38 L40,38 Z" 
          fill="url(#snapBuyGrad)" 
          stroke="#ffffff" 
          stroke-width="2" 
          stroke-linejoin="round"/>
    
    <!-- Bag Handle Overlay Curve -->
    <path d="M24,32 C24,18 32,10 42,10 C52,10 56,18 56,24" 
          fill="none" 
          stroke="url(#snapBuyGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          opacity="0.85"/>
  </g>

  <!-- Typography Alignment Group -->
  <g id="LogoText" transform="translate(95, 62)">
    <!-- "Snap" - Bold, Modern Deep Slate -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="42px" 
          font-weight="900" 
          letter-spacing="-0.03em" 
          fill="#1e293b">Snap</text>
          
    <!-- "Buy" - Precise Medium Weight Teal Accent -->
    <text x="106" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="42px" 
          font-weight="500" 
          letter-spacing="0.01em" 
          fill="#0d9488">Buy</text>
  </g>
</svg>
